[project]
name = "minion-memory"
version = "0.0.0"
description = "Minion-Memory (Project Mneme) — Python implementation. WP-00 scaffold: no memory behavior."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0.2",
    "jsonschema>=4.23",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "types-jsonschema",
    "rfc8785==0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minion_memory"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# OWN-001: no cache inside the repo.
addopts = "-q -p no:cacheprovider"
