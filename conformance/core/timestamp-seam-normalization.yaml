scenario_format: 1
id: core.history.timestamp-seam-normalization
family: core
layer: '01'
status: DRAFT
title: 'Timestamps: the shared input grammar is accepted and normalized to canonical UTC; everything else is rejected'
description: Owner G-022, G-026, G-028, G-029, G-030; offset/second/fraction grammar per RFC 3339 5.6. Every implementation must accept every listed input and reject every listed error (G-030).
requirements:
- HIST-004
given: {}
when:
- normalize_timestamp:
    case: canonical form unchanged
    input: '2026-10-10T05:30:00.123456Z'
- normalize_timestamp:
    case: no fraction padded
    input: '2026-10-10T05:30:00Z'
- normalize_timestamp:
    case: short fraction right-padded
    input: '2026-10-10T05:30:00.5Z'
- normalize_timestamp:
    case: positive offset to UTC
    input: '2026-10-10T16:30:00+11:00'
- normalize_timestamp:
    case: negative offset crosses the date
    input: '2026-10-09T22:30:00.25-07:00'
- normalize_timestamp:
    case: offset crosses a leap day
    input: '2028-03-01T03:00:00+05:00'
- normalize_timestamp:
    case: lowercase t accepted (G-028)
    input: '2026-10-10t05:30:00Z'
- normalize_timestamp:
    case: lowercase z accepted (G-028)
    input: 2026-10-10T05:30:00z
- normalize_timestamp:
    case: lowercase t and z
    input: 2026-10-10t05:30:00.000001z
- normalize_timestamp:
    case: minus-zero offset is UTC
    input: '2026-10-10T05:30:00-00:00'
- normalize_timestamp:
    case: largest offset
    input: '2026-10-10T23:59:00+23:59'
- normalize_timestamp:
    case: century leap day
    input: '2000-02-29T12:00:00Z'
- normalize_timestamp:
    case: earliest instant
    input: '0001-01-01T00:00:00Z'
- normalize_timestamp:
    case: latest instant
    input: '9999-12-31T23:59:59.999999Z'
- normalize_timestamp:
    case: offset moving away from the lower bound
    input: '0001-01-01T00:00:00-00:01'
- normalize_timestamp:
    case: offset moving away from the upper bound
    input: '9999-12-31T23:59:59+00:01'
- normalize_timestamp:
    case: no timezone
    input: '2026-10-10T05:30:00'
- normalize_timestamp:
    case: seven fractional digits
    input: '2026-10-10T05:30:00.1234567Z'
- normalize_timestamp:
    case: dot without digits
    input: '2026-10-10T05:30:00.Z'
- normalize_timestamp:
    case: leap second
    input: '2026-12-31T23:59:60Z'
- normalize_timestamp:
    case: invalid calendar day
    input: '2026-02-30T00:00:00Z'
- normalize_timestamp:
    case: non-leap century day
    input: '1900-02-29T00:00:00Z'
- normalize_timestamp:
    case: year zero (G-029)
    input: '0000-01-01T00:00:00Z'
- normalize_timestamp:
    case: UTC result before year 0001 (G-029)
    input: '0001-01-01T00:00:00+00:01'
- normalize_timestamp:
    case: UTC result after year 9999 (G-029)
    input: '9999-12-31T23:59:59-00:01'
- normalize_timestamp:
    case: hour 24
    input: '2026-10-10T24:00:00Z'
- normalize_timestamp:
    case: minute 60
    input: '2026-10-10T05:60:00Z'
- normalize_timestamp:
    case: offset hour 24
    input: '2026-10-10T05:30:00+24:00'
- normalize_timestamp:
    case: offset minute 60
    input: '2026-10-10T05:30:00+05:60'
- normalize_timestamp:
    case: offset without colon
    input: 2026-10-10T05:30:00+0530
- normalize_timestamp:
    case: offset hours only
    input: '2026-10-10T05:30:00+05'
- normalize_timestamp:
    case: space instead of T
    input: '2026-10-10 05:30:00Z'
- normalize_timestamp:
    case: named zone
    input: 2026-10-10T05:30:00UTC
- normalize_timestamp:
    case: surrounding whitespace
    input: ' 2026-10-10T05:30:00Z'
- normalize_timestamp:
    case: non-ASCII digit
    input: 2026-10-1٠T05:30:00Z
- normalize_timestamp:
    case: two-digit year
    input: 26-10-10T05:30:00Z
expect:
  results:
  - case: canonical form unchanged
    canonical: '2026-10-10T05:30:00.123456Z'
  - case: no fraction padded
    canonical: '2026-10-10T05:30:00.000000Z'
  - case: short fraction right-padded
    canonical: '2026-10-10T05:30:00.500000Z'
  - case: positive offset to UTC
    canonical: '2026-10-10T05:30:00.000000Z'
  - case: negative offset crosses the date
    canonical: '2026-10-10T05:30:00.250000Z'
  - case: offset crosses a leap day
    canonical: '2028-02-29T22:00:00.000000Z'
  - case: lowercase t accepted (G-028)
    canonical: '2026-10-10T05:30:00.000000Z'
  - case: lowercase z accepted (G-028)
    canonical: '2026-10-10T05:30:00.000000Z'
  - case: lowercase t and z
    canonical: '2026-10-10T05:30:00.000001Z'
  - case: minus-zero offset is UTC
    canonical: '2026-10-10T05:30:00.000000Z'
  - case: largest offset
    canonical: '2026-10-10T00:00:00.000000Z'
  - case: century leap day
    canonical: '2000-02-29T12:00:00.000000Z'
  - case: earliest instant
    canonical: '0001-01-01T00:00:00.000000Z'
  - case: latest instant
    canonical: '9999-12-31T23:59:59.999999Z'
  - case: offset moving away from the lower bound
    canonical: '0001-01-01T00:01:00.000000Z'
  - case: offset moving away from the upper bound
    canonical: '9999-12-31T23:58:59.000000Z'
  - case: no timezone
    error: timestamp.invalid
  - case: seven fractional digits
    error: timestamp.invalid
  - case: dot without digits
    error: timestamp.invalid
  - case: leap second
    error: timestamp.invalid
  - case: invalid calendar day
    error: timestamp.invalid
  - case: non-leap century day
    error: timestamp.invalid
  - case: year zero (G-029)
    error: timestamp.invalid
  - case: UTC result before year 0001 (G-029)
    error: timestamp.invalid
  - case: UTC result after year 9999 (G-029)
    error: timestamp.invalid
  - case: hour 24
    error: timestamp.invalid
  - case: minute 60
    error: timestamp.invalid
  - case: offset hour 24
    error: timestamp.invalid
  - case: offset minute 60
    error: timestamp.invalid
  - case: offset without colon
    error: timestamp.invalid
  - case: offset hours only
    error: timestamp.invalid
  - case: space instead of T
    error: timestamp.invalid
  - case: named zone
    error: timestamp.invalid
  - case: surrounding whitespace
    error: timestamp.invalid
  - case: non-ASCII digit
    error: timestamp.invalid
  - case: two-digit year
    error: timestamp.invalid
negative_controls:
- accepting a timezone-less timestamp as local time
- rounding or truncating a seventh fractional digit
- preserving the input offset or letter case in the stored value
- relying on a host parser that accepts ' ' for 'T', ':60' or year 0000
- clamping or wrapping an instant that leaves 0001..9999 after offset normalization
