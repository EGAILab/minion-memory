scenario_format: 1
id: core.identity.version-integer-edition-ordering
family: core
layer: '01'
status: ACTIVE
title: Versions are positive integer editions compared numerically
description: Owner G-012; integer domain per G-016. Expectations follow directly from the decision.
requirements:
- CORE-002
given: {}
when:
- compare_versions:
    case: higher edition
    a: 4
    b: 3
- compare_versions:
    case: equal edition
    a: 3
    b: 3
- compare_versions:
    case: numeric not lexical
    a: 10
    b: 9
- compare_versions:
    case: lower edition
    a: 1
    b: 2
- compare_versions:
    case: whole-number float spelling is the same edition (G-023)
    a: 2.0
    b: 2
- compare_versions:
    case: invalid zero
    a: 0
    b: 1
- compare_versions:
    case: invalid negative
    a: -1
    b: 1
- compare_versions:
    case: invalid non-integral
    a: 1.5
    b: 1
- compare_versions:
    case: invalid boolean
    a: true
    b: 1
- compare_versions:
    case: invalid string
    a: '1'
    b: 1
- compare_versions:
    case: invalid above safe bound fails the value domain first (G-031)
    a: 9007199254740992
    b: 1
- compare_versions:
    case: first argument reported first (G-031)
    a: 0
    b: -1
expect:
  results:
  - case: higher edition
    result: greater
  - case: equal edition
    result: equal
  - case: numeric not lexical
    result: greater
  - case: lower edition
    result: less
  - case: whole-number float spelling is the same edition (G-023)
    result: equal
  - case: invalid zero
    error: version.invalid
  - case: invalid negative
    error: version.invalid
  - case: invalid non-integral
    error: version.invalid
  - case: invalid boolean
    error: version.invalid
  - case: invalid string
    error: version.invalid
  - case: invalid above safe bound fails the value domain first (G-031)
    error: value.integer_out_of_range
  - case: first argument reported first (G-031)
    error: version.invalid
    argument: a
negative_controls:
- lexical comparison ('10' < '9')
- accepting 0 or negative editions
