scenario_format: 1
id: core.history.replay-compatibility
family: core
layer: '02'
status: ACTIVE
title: Unrecognized records are skipped only when declared ignorable; unrecognized required records stop replay
description: SER-005 replay admission; Owner G-048..G-055 (reference/governance/2026-10-11-owner-layer02-start.md).
requirements:
- SER-005
given: {}
when:
- admit_history_record:
    case: 'unrecognized type, ignorable: skip'
    reader:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: exposure
        schema_version: 2
    record:
      record_id: ev-0001
      profile: learning
      record_type: telemetry-ping
      schema_version: 1
      compatibility: ignorable
      recorded_at: '2026-10-11T08:00:00Z'
- admit_history_record:
    case: 'unrecognized type, required: replay stops'
    reader:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: exposure
        schema_version: 2
    record:
      record_id: ev-0001
      profile: learning
      record_type: correction
      schema_version: 1
      compatibility: required
      recorded_at: '2026-10-11T08:00:00Z'
- admit_history_record:
    case: recognized type, unrecognized schema version, required
    reader:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: exposure
        schema_version: 2
    record:
      record_id: ev-0001
      profile: learning
      record_type: attempt
      schema_version: 2
      compatibility: required
      recorded_at: '2026-10-11T08:00:00Z'
- admit_history_record:
    case: recognized type, unrecognized schema version, ignorable
    reader:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: exposure
        schema_version: 2
    record:
      record_id: ev-0001
      profile: learning
      record_type: attempt
      schema_version: 3
      compatibility: ignorable
      recorded_at: '2026-10-11T08:00:00Z'
- admit_history_record:
    case: unrecognized ignorable is not validated as a known closed schema (G-048)
    reader:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: exposure
        schema_version: 2
    record:
      record_id: ev-0001
      profile: learning
      record_type: telemetry-ping
      schema_version: 1
      compatibility: ignorable
      new_member:
        x: 1
- admit_history_record:
    case: unrecognized required is not validated as a known closed schema (G-048)
    reader:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: exposure
        schema_version: 2
    record:
      record_id: Not-An-Id
      profile: learning
      record_type: correction
      schema_version: 1
      compatibility: required
      recorded_at: '2026-10-11T08:00:00Z'
      new_member: true
- admit_history_record:
    case: 'unrecognized with invalid identity: envelope error, not skip'
    reader:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: exposure
        schema_version: 2
    record:
      record_id: ev-0001
      profile: learning
      record_type: telemetry-ping
      schema_version: 1
      recorded_at: '2026-10-11T08:00:00Z'
- admit_history_record:
    case: recognized ignorable record is decoded, not skipped
    reader:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: exposure
        schema_version: 2
    record:
      record_id: ev-0001
      profile: learning
      record_type: exposure
      schema_version: 2
      compatibility: ignorable
      recorded_at: '2026-10-11T08:00:00Z'
- admit_history_record:
    case: reader with an unknown member
    reader:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: exposure
        schema_version: 2
      mode: lenient
    record:
      record_id: ev-0001
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
      recorded_at: '2026-10-11T08:00:00Z'
- admit_history_record:
    case: reader with a duplicate recognized pair
    reader:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: attempt
        schema_version: 1.0
    record:
      record_id: ev-0001
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
      recorded_at: '2026-10-11T08:00:00Z'
- admit_history_record:
    case: reader errors precede record errors (declared order)
    reader:
      profile: Learning
      recognized: []
    record:
      record_id: ev-0001
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
      recorded_at: '2026-10-11T08:00:00Z'
      extra: 1
- admit_history_record:
    case: reader without recognized (G-053)
    reader:
      profile: learning
    record:
      record_id: ev-0001
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
      recorded_at: '2026-10-11T08:00:00Z'
- admit_history_record:
    case: recognized entry with an unknown member (G-053)
    reader:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
        since: 1
    record:
      record_id: ev-0001
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
      recorded_at: '2026-10-11T08:00:00Z'
- admit_history_record:
    case: recognized entry with schema_version 0 (G-052)
    reader:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 0
    record:
      record_id: ev-0001
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
      recorded_at: '2026-10-11T08:00:00Z'
- admit_history_record:
    case: same-profile unrecognized record with invalid compatibility
    reader:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: exposure
        schema_version: 2
    record:
      record_id: ev-0001
      profile: learning
      record_type: telemetry-ping
      schema_version: 1
      compatibility: bogus
      recorded_at: '2026-10-11T08:00:00Z'
expect:
  results:
  - case: 'unrecognized type, ignorable: skip'
    outcome: skip
  - case: 'unrecognized type, required: replay stops'
    error: history.unknown_required
  - case: recognized type, unrecognized schema version, required
    error: history.unknown_required
  - case: recognized type, unrecognized schema version, ignorable
    outcome: skip
  - case: unrecognized ignorable is not validated as a known closed schema (G-048)
    outcome: skip
  - case: unrecognized required is not validated as a known closed schema (G-048)
    error: history.unknown_required
  - case: 'unrecognized with invalid identity: envelope error, not skip'
    error: history.envelope_invalid
    argument: record
  - case: recognized ignorable record is decoded, not skipped
    outcome: decode
    envelope:
      record_id: ev-0001
      profile: learning
      record_type: exposure
      schema_version: 2
      compatibility: ignorable
      recorded_at: '2026-10-11T08:00:00.000000Z'
  - case: reader with an unknown member
    error: history.reader_invalid
    argument: reader
  - case: reader with a duplicate recognized pair
    error: history.reader_invalid
    argument: reader
  - case: reader errors precede record errors (declared order)
    error: history.reader_invalid
    argument: reader
  - case: reader without recognized (G-053)
    error: history.reader_invalid
    argument: reader
  - case: recognized entry with an unknown member (G-053)
    error: history.reader_invalid
    argument: reader
  - case: recognized entry with schema_version 0 (G-052)
    error: history.reader_invalid
    argument: reader
  - case: same-profile unrecognized record with invalid compatibility
    error: history.envelope_invalid
    argument: record
negative_controls:
- skipping an unknown required record
- treating a missing compatibility as ignorable
- validating an unrecognized schema as the current closed shape
- skipping a recognized ignorable record
