    - '2026-10-11T09:00:00Z'
- commit_history:
    case: first commit
    store_id: store-1
    writer:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: evaluation
        schema_version: 1
    operation:
      source_namespace: app
      source_operation_id: r-1
    records:
    - record_id: o-1
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
    - record_id: e-1
      profile: learning
      record_type: evaluation
      schema_version: 1
      compatibility: required
- commit_history:
    case: an identical retry returns the original receipt, original recorded_at included
    store_id: store-1
    writer:
      profile: learning
