scenario_format: 1
id: core.history.same-operation-retry-commits-once
family: core
layer: '04'
status: ACTIVE
title: Retrying the same durable operation identity commits one historical record
description: CORE-012, PERS-006, HIST-008; Owner G-077..G-087 (reference/governance/2026-10-11-owner-layer04-start.md);
  spec/persistence.md Layer 04. Each scenario runs its steps in order against one fresh backend with no
  stores.
requirements:
- CORE-012
- PERS-006
- HIST-008
given: {}
when:
- create_store:
    case: create store
    store_id: store-1
    clock:
    - '2026-10-11T08:00:00.000000Z'
    - '2026-10-11T09:00:00.000000Z'
    - '2026-10-11T10:00:00.000000Z'
- commit_history:
    case: first commit
    store_id: store-1
    writer:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: evaluation
        schema_version: 1
    operation:
      source_namespace: app
      source_operation_id: r-1
    records:
    - record_id: o-1
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
    - record_id: e-1
      profile: learning
      record_type: evaluation
      schema_version: 1
      compatibility: required
- commit_history:
    case: an identical retry returns the original receipt, original recorded_at included; no clock sample
    store_id: store-1
    writer:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: evaluation
        schema_version: 1
    operation:
      source_namespace: app
      source_operation_id: r-1
    records:
    - record_id: o-1
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
    - record_id: e-1
      profile: learning
      record_type: evaluation
      schema_version: 1
      compatibility: required
- commit_history:
    case: a writer with a different recognized set is not part of the mutation
    store_id: store-1
    writer:
      profile: learning
      recognized:
      - record_type: correction
        schema_version: 1
      - record_type: evaluation
        schema_version: 1
      - record_type: attempt
        schema_version: 1
    operation:
      source_namespace: app
      source_operation_id: r-1
    records:
    - record_id: o-1
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
    - record_id: e-1
      profile: learning
      record_type: evaluation
      schema_version: 1
      compatibility: required
- commit_history:
    case: a different mutation under the same operation is a visible conflict (G-013)
    store_id: store-1
    writer:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: evaluation
        schema_version: 1
    operation:
      source_namespace: app
      source_operation_id: r-1
    records:
    - record_id: o-1
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
- commit_history:
    case: reordered drafts are a different mutation
    store_id: store-1
    writer:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: evaluation
        schema_version: 1
    operation:
      source_namespace: app
      source_operation_id: r-1
    records:
    - record_id: e-1
      profile: learning
      record_type: evaluation
      schema_version: 1
      compatibility: required
    - record_id: o-1
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
- commit_history:
    case: the same source_operation_id in another namespace is another operation
    store_id: store-1
    writer:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: evaluation
        schema_version: 1
    operation:
      source_namespace: other
      source_operation_id: r-1
    records:
    - record_id: o-2
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
- commit_history:
    case: a NUL source_operation_id is a valid identity (G-033)
    store_id: store-1
    writer:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: evaluation
        schema_version: 1
    operation:
      source_namespace: app
      source_operation_id: "\0"
    records:
    - record_id: o-5
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
      payload:
        n: 2
      occurred_at: '2026-10-11T08:00:00Z'
- commit_history:
    case: a retry spelled differently but equal after normalization (offset occurred_at, 2.0) returns
      the original receipt
    store_id: store-1
    writer:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: evaluation
        schema_version: 1
    operation:
      source_namespace: app
      source_operation_id: "\0"
    records:
    - record_id: o-5
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
      payload:
        n: 2.0
      occurred_at: '2026-10-11T10:00:00+02:00'
- commit_history:
    case: a different mutation under the NUL identity conflicts
    store_id: store-1
    writer:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: evaluation
        schema_version: 1
    operation:
      source_namespace: app
      source_operation_id: "\0"
    records:
    - record_id: o-6
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
- commit_history:
    case: a-NUL-b is a different identity from the NUL identity, so its reuse of o-5 is a store duplicate
    store_id: store-1
    writer:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: evaluation
        schema_version: 1
    operation:
      source_namespace: app
      source_operation_id: "a\0b"
    records:
    - record_id: o-5
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
      payload:
        n: 2
      occurred_at: '2026-10-11T08:00:00Z'
- store_tail:
    case: retries and conflicts consumed no positions
    store_id: store-1
expect:
  results:
  - case: create store
    result: created
  - case: first commit
    receipt:
      store_id: store-1
      operation:
        source_namespace: app
        source_operation_id: r-1
      first_position: 1
      last_position: 2
      recorded_at: '2026-10-11T08:00:00.000000Z'
      records:
      - record_id: o-1
        profile: learning
        record_type: attempt
        schema_version: 1
        compatibility: required
        recorded_at: '2026-10-11T08:00:00.000000Z'
      - record_id: e-1
        profile: learning
        record_type: evaluation
        schema_version: 1
        compatibility: required
        recorded_at: '2026-10-11T08:00:00.000000Z'
  - case: an identical retry returns the original receipt, original recorded_at included; no clock sample
    receipt:
      store_id: store-1
      operation:
        source_namespace: app
        source_operation_id: r-1
      first_position: 1
      last_position: 2
      recorded_at: '2026-10-11T08:00:00.000000Z'
      records:
      - record_id: o-1
        profile: learning
        record_type: attempt
        schema_version: 1
        compatibility: required
        recorded_at: '2026-10-11T08:00:00.000000Z'
      - record_id: e-1
        profile: learning
        record_type: evaluation
        schema_version: 1
        compatibility: required
        recorded_at: '2026-10-11T08:00:00.000000Z'
  - case: a writer with a different recognized set is not part of the mutation
    receipt:
      store_id: store-1
      operation:
        source_namespace: app
        source_operation_id: r-1
      first_position: 1
      last_position: 2
      recorded_at: '2026-10-11T08:00:00.000000Z'
      records:
      - record_id: o-1
        profile: learning
        record_type: attempt
        schema_version: 1
        compatibility: required
        recorded_at: '2026-10-11T08:00:00.000000Z'
      - record_id: e-1
        profile: learning
        record_type: evaluation
        schema_version: 1
        compatibility: required
        recorded_at: '2026-10-11T08:00:00.000000Z'
  - case: a different mutation under the same operation is a visible conflict (G-013)
    error: persistence.operation_conflict
    argument: operation
  - case: reordered drafts are a different mutation
    error: persistence.operation_conflict
    argument: operation
  - case: the same source_operation_id in another namespace is another operation
    receipt:
      store_id: store-1
      operation:
        source_namespace: other
        source_operation_id: r-1
      first_position: 3
      last_position: 3
      recorded_at: '2026-10-11T09:00:00.000000Z'
      records:
      - record_id: o-2
        profile: learning
        record_type: attempt
        schema_version: 1
        compatibility: required
        recorded_at: '2026-10-11T09:00:00.000000Z'
  - case: a NUL source_operation_id is a valid identity (G-033)
    receipt:
      store_id: store-1
      operation:
        source_namespace: app
        source_operation_id: "\0"
      first_position: 4
      last_position: 4
      recorded_at: '2026-10-11T10:00:00.000000Z'
      records:
      - record_id: o-5
        profile: learning
        record_type: attempt
        schema_version: 1
        compatibility: required
        payload:
          n: 2
        occurred_at: '2026-10-11T08:00:00.000000Z'
        recorded_at: '2026-10-11T10:00:00.000000Z'
  - case: a retry spelled differently but equal after normalization (offset occurred_at, 2.0) returns
      the original receipt
    receipt:
      store_id: store-1
      operation:
        source_namespace: app
        source_operation_id: "\0"
      first_position: 4
      last_position: 4
      recorded_at: '2026-10-11T10:00:00.000000Z'
      records:
      - record_id: o-5
        profile: learning
        record_type: attempt
        schema_version: 1
        compatibility: required
        payload:
          n: 2
        occurred_at: '2026-10-11T08:00:00.000000Z'
        recorded_at: '2026-10-11T10:00:00.000000Z'
  - case: a different mutation under the NUL identity conflicts
    error: persistence.operation_conflict
    argument: operation
  - case: a-NUL-b is a different identity from the NUL identity, so its reuse of o-5 is a store duplicate
    error: history.duplicate_record_id
    argument: records
  - case: retries and conflicts consumed no positions
    boundary:
      store_id: store-1
      position: 4
negative_controls:
- retry appends a second record
- retry deduplicates by content similarity instead of operation identity
- a retry returns a fresh recorded_at
- a conflicting retry overwrites (last-write-wins)
- the mutation is compared as raw caller bytes instead of normalized drafts
- the operation ID is trimmed, rejected or mangled at a NUL character
