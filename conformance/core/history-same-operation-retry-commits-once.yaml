      operation:
        source_namespace: app
        source_operation_id: r-1
      first_position: 1
      last_position: 2
      recorded_at: '2026-10-11T08:00:00Z'
      records:
      - record_id: o-1
        profile: learning
        record_type: attempt
        schema_version: 1
        compatibility: required
        recorded_at: '2026-10-11T08:00:00Z'
      - record_id: e-1
        profile: learning
        record_type: evaluation
        schema_version: 1
        compatibility: required
        recorded_at: '2026-10-11T08:00:00Z'
  - case: a different mutation under the same operation is a visible conflict (G-013)
    error: persistence.operation_conflict
