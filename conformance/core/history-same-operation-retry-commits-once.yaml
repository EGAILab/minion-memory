    store_id: store-1
    writer:
      profile: learning
      recognized:
      - record_type: evaluation
        schema_version: 1
      - record_type: attempt
        schema_version: 1
    operation:
      source_namespace: app
      source_operation_id: r-1
    records:
    - record_id: o-1
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
    - record_id: e-1
      profile: learning
      record_type: evaluation
      schema_version: 1
      compatibility: required
- commit_history:
    case: a different mutation under the same operation is a visible conflict (G-013)
    store_id: store-1
    writer:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: evaluation
        schema_version: 1
    operation:
      source_namespace: app
      source_operation_id: r-1
    records:
    - record_id: o-1
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
