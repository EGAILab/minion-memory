scenario_format: 1
id: core.history.same-operation-retry-commits-once
family: core
layer: '04'
status: DRAFT
title: Retrying the same durable operation identity commits one historical record
description: CORE-012, PERS-006, HIST-008; Owner G-077..G-084 (reference/governance/2026-10-11-owner-layer04-start.md);
  spec/persistence.md Layer 04. Each scenario starts with no stores; steps run in order against one fresh
  backend.
requirements:
- CORE-012
- PERS-006
- HIST-008
given: {}
when:
