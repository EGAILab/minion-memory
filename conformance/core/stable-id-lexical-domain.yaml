scenario_format: 1
id: core.identity.stable-id-lexical-domain
family: core
layer: '01'
status: ACTIVE
title: Stable IDs are portable lowercase ASCII tokens compared byte for byte
description: Owner G-020. Expectations follow directly from the decision text.
requirements:
- CORE-001
given: {}
when:
- validate_stable_id:
    case: lowercase token
    id: ku_7f3a.v2
- validate_stable_id:
    case: digit start
    id: 0abc
- validate_stable_id:
    case: maximum length 128
    id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
- validate_stable_id:
    case: length 129
    id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
- validate_stable_id:
    case: empty
    id: ''
- validate_stable_id:
    case: uppercase letter
    id: Ku1
- validate_stable_id:
    case: non-ASCII letter
    id: kü
- validate_stable_id:
    case: starts with dot
    id: .hidden
- validate_stable_id:
    case: starts with hyphen
    id: -x
- validate_stable_id:
    case: trailing dot
    id: abc.
- validate_stable_id:
    case: path separator
    id: a/b
- validate_stable_id:
    case: device basename
    id: con
- validate_stable_id:
    case: device basename with suffix
    id: nul.txt
- validate_stable_id:
    case: numbered device basename
    id: com7
- validate_stable_id:
    case: device prefix is not a device
    id: console
- validate_stable_id:
    case: com0 is not a device
    id: com0
expect:
  results:
  - case: lowercase token
    result: valid
  - case: digit start
    result: valid
  - case: maximum length 128
    result: valid
  - case: length 129
    error: id.invalid
  - case: empty
    error: id.invalid
  - case: uppercase letter
    error: id.invalid
  - case: non-ASCII letter
    error: id.invalid
  - case: starts with dot
    error: id.invalid
  - case: starts with hyphen
    error: id.invalid
  - case: trailing dot
    error: id.invalid
  - case: path separator
    error: id.invalid
  - case: device basename
    error: id.invalid
  - case: device basename with suffix
    error: id.invalid
  - case: numbered device basename
    error: id.invalid
  - case: device prefix is not a device
    result: valid
  - case: com0 is not a device
    result: valid
negative_controls:
- case-folding or Unicode-normalizing IDs before comparison
- accepting a Windows device basename because it has an extension-like suffix
- counting characters instead of bytes for the 128 limit
