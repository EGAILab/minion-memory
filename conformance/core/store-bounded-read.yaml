  results:
  - case: create store
    result: created
  - case: create a second store
    result: created
  - case: commit three
    receipt:
      store_id: store-1
      operation:
        source_namespace: app
        source_operation_id: p-1
      first_position: 1
      last_position: 3
      recorded_at: '2026-10-11T08:00:00Z'
      records:
      - record_id: o-1
        profile: learning
        record_type: attempt
        schema_version: 1
        compatibility: required
        recorded_at: '2026-10-11T08:00:00Z'
      - record_id: o-2
        profile: learning
        record_type: attempt
        schema_version: 1
        compatibility: required
        recorded_at: '2026-10-11T08:00:00Z'
      - record_id: o-3
        profile: learning
        record_type: attempt
        schema_version: 1
        compatibility: required
        recorded_at: '2026-10-11T08:00:00Z'
  - case: commit two
    receipt:
      store_id: store-1
      operation:
        source_namespace: app
        source_operation_id: p-2
      first_position: 4
      last_position: 5
      recorded_at: '2026-10-11T09:00:00Z'
      records:
      - record_id: o-4
        profile: learning
        record_type: attempt
        schema_version: 1
        compatibility: required
        recorded_at: '2026-10-11T09:00:00Z'
      - record_id: o-5
        profile: learning
        record_type: attempt
        schema_version: 1
        compatibility: required
        recorded_at: '2026-10-11T09:00:00Z'
  - case: a first page of two from the empty boundary
    page:
      entries:
      - position: 1
        record:
          record_id: o-1
          profile: learning
          record_type: attempt
          schema_version: 1
          compatibility: required
          recorded_at: '2026-10-11T08:00:00Z'
      - position: 2
        record:
          record_id: o-2
          profile: learning
          record_type: attempt
          schema_version: 1
          compatibility: required
          recorded_at: '2026-10-11T08:00:00Z'
      through:
        store_id: store-1
        position: 2
      tail:
        store_id: store-1
        position: 5
  - case: the next page continues from its through boundary
    page:
      entries:
      - position: 3
        record:
          record_id: o-3
          profile: learning
          record_type: attempt
          schema_version: 1
          compatibility: required
          recorded_at: '2026-10-11T08:00:00Z'
      - position: 4
        record:
          record_id: o-4
          profile: learning
          record_type: attempt
          schema_version: 1
          compatibility: required
          recorded_at: '2026-10-11T09:00:00Z'
      through:
        store_id: store-1
        position: 4
      tail:
        store_id: store-1
        position: 5
  - case: the last page is short
    page:
      entries:
      - position: 5
        record:
          record_id: o-5
          profile: learning
          record_type: attempt
          schema_version: 1
          compatibility: required
          recorded_at: '2026-10-11T09:00:00Z'
      through:
        store_id: store-1
        position: 5
      tail:
        store_id: store-1
        position: 5
  - case: reading at the tail returns no entries; through stays at since
    page:
      entries: []
      through:
        store_id: store-1
        position: 5
      tail:
        store_id: store-1
        position: 5
  - case: a boundary of another store is incomparable
    error: history.boundary_incomparable
    argument: since
  - case: a boundary beyond the tail is invalid
    error: history.boundary_invalid
    argument: since
  - case: limit 0 is invalid
    error: persistence.limit_invalid
    argument: limit
  - case: a non-integral limit is invalid
    error: persistence.limit_invalid
    argument: limit
  - case: an empty store reads empty at boundary 0
    page:
      entries: []
      through:
        store_id: store-2
        position: 0
      tail:
        store_id: store-2
        position: 0
negative_controls:
- a page splits or skips a position
- through advances past the last returned entry
- a boundary from another store is accepted because its position is in range
