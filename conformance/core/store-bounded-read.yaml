scenario_format: 1
id: core.store.bounded-read
family: core
layer: '04'
status: DRAFT
title: Since-boundary pages over gapless positions; boundaries of other stores are incomparable
description: PERS-007, PERS-008, HIST-005; Owner G-077..G-084 (reference/governance/2026-10-11-owner-layer04-start.md);
  spec/persistence.md Layer 04. Each scenario starts with no stores; steps run in order against one fresh
  backend.
requirements:
- PERS-007
- PERS-008
- HIST-005
given: {}
when:
- create_store:
    case: create store
    store_id: store-1
    clock:
    - '2026-10-11T08:00:00Z'
    - '2026-10-11T09:00:00Z'
- create_store:
    case: create a second store
    store_id: store-2
    clock:
    - '2026-10-11T08:00:00Z'
- commit_history:
    case: commit three
    store_id: store-1
    writer:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: evaluation
        schema_version: 1
    operation:
      source_namespace: app
      source_operation_id: p-1
    records:
    - record_id: o-1
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
    - record_id: o-2
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
    - record_id: o-3
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
- commit_history:
    case: commit two
    store_id: store-1
    writer:
      profile: learning
      recognized:
      - record_type: attempt
        schema_version: 1
      - record_type: evaluation
        schema_version: 1
    operation:
      source_namespace: app
      source_operation_id: p-2
    records:
    - record_id: o-4
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
    - record_id: o-5
      profile: learning
      record_type: attempt
      schema_version: 1
      compatibility: required
- read_history:
    case: a first page of two from the empty boundary
    store_id: store-1
    since:
      store_id: store-1
      position: 0
    limit: 2
- read_history:
    case: the next page continues from its through boundary
    store_id: store-1
    since:
      store_id: store-1
      position: 2
    limit: 2
- read_history:
    case: the last page is short
    store_id: store-1
    since:
      store_id: store-1
      position: 4
    limit: 2
- read_history:
    case: reading at the tail returns no entries; through stays at since
    store_id: store-1
    since:
      store_id: store-1
      position: 5
    limit: 2
- read_history:
    case: a boundary of another store is incomparable
    store_id: store-1
    since:
      store_id: store-2
      position: 0
    limit: 2
- read_history:
    case: a boundary beyond the tail is invalid
    store_id: store-1
    since:
      store_id: store-1
      position: 6
    limit: 2
- read_history:
    case: limit 0 is invalid
    store_id: store-1
    since:
      store_id: store-1
      position: 0
    limit: 0
- read_history:
    case: a non-integral limit is invalid
    store_id: store-1
    since:
      store_id: store-1
      position: 0
    limit: 1.5
- read_history:
    case: an empty store reads empty at boundary 0
    store_id: store-2
    since:
      store_id: store-2
      position: 0
    limit: 3
