scenario_format: 1
id: core.serialization.portable-value-domain-rejections
family: core
layer: '01'
status: DRAFT
title: Values outside the portable domain are rejected at the seam with a stable error code
description: Domain per Owner G-015 as amended by G-016 (integers within +/-(2^53-1)) and G-017. Error codes are a DRAFT contract vocabulary for review.
requirements:
- SER-008
given: {}
when:
- canonicalize:
    case: integer above the safe bound
    value_json: '{"v":9007199254740992}'
- canonicalize:
    case: integer below the safe bound
    value_json: '{"v":-9007199254740992}'
- canonicalize:
    case: whole number above the bound in float spelling (G-025)
    value_json: '{"v":9007199254740992.0}'
- canonicalize:
    case: whole number above the bound in exponent spelling (G-025)
    value_json: '{"v":9.007199254740992e15}'
- canonicalize:
    case: large exponent value is integral (G-025)
    value_json: '{"v":1e21}'
- canonicalize:
    case: rounds up to 2^53 (G-025 after binary64 rounding)
    value_json: '{"v":9007199254740991.5}'
- canonicalize:
    case: binary64 overflow of a valid numeral
    value_json: '{"v":1e400}'
- canonicalize:
    case: lone high surrogate
    value_json: '{"v":"\ud800"}'
- canonicalize:
    case: lone low surrogate in a key
    value_json: '{"\udc00":1}'
- canonicalize:
    case: duplicate object key
    value_json: '{"a":1,"a":2}'
- canonicalize:
    case: duplicate after escape decoding
    value_json: '{"a":1,"\u0061":2}'
- canonicalize:
    case: non-finite number literal
    value_json: '{"v":Infinity}'
- canonicalize:
    case: NaN literal
    value_json: '{"v":NaN}'
- canonicalize:
    case: leading zero
    value_json: '{"v":01}'
- canonicalize:
    case: trailing content
    value_json: '{"v":1} x'
- canonicalize:
    case: 'precedence: stage-1 duplicate before stage-2 range'
    value_json: '{"a":1,"a":9007199254740992}'
- canonicalize:
    case: 'precedence: stage-1 order is source order'
    value_json: '{"a":"\ud800","a":1}'
- canonicalize:
    case: 'precedence: stage-2 order is canonical member order'
    value_json: '{"b":9007199254740992,"a":1e400}'
expect:
  results:
  - case: integer above the safe bound
    error: value.integer_out_of_range
  - case: integer below the safe bound
    error: value.integer_out_of_range
  - case: whole number above the bound in float spelling (G-025)
    error: value.integer_out_of_range
  - case: whole number above the bound in exponent spelling (G-025)
    error: value.integer_out_of_range
  - case: large exponent value is integral (G-025)
    error: value.integer_out_of_range
  - case: rounds up to 2^53 (G-025 after binary64 rounding)
    error: value.integer_out_of_range
  - case: binary64 overflow of a valid numeral
    error: value.number_not_finite
  - case: lone high surrogate
    error: value.lone_surrogate
  - case: lone low surrogate in a key
    error: value.lone_surrogate
  - case: duplicate object key
    error: value.duplicate_key
  - case: duplicate after escape decoding
    error: value.duplicate_key
  - case: non-finite number literal
    error: value.invalid_json
  - case: NaN literal
    error: value.invalid_json
  - case: leading zero
    error: value.invalid_json
  - case: trailing content
    error: value.invalid_json
  - case: 'precedence: stage-1 duplicate before stage-2 range'
    error: value.duplicate_key
  - case: 'precedence: stage-1 order is source order'
    error: value.lone_surrogate
  - case: 'precedence: stage-2 order is canonical member order'
    error: value.number_not_finite
negative_controls:
- accepting 2^53 because the host integer type can hold it (Python int, Rust i64)
- replacing a lone surrogate with U+FFFD instead of rejecting
- last-key-wins on duplicate keys (default of Python json and serde_json)
